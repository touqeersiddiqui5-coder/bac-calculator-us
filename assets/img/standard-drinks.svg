<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" width="560" height="285" role="img" aria-labelledby="t d">
<title id="t">One standard drink in three different glasses</title>
<desc id="d">Illustration comparing a 12 oz beer, 5 oz wine and 1.5 oz spirit serving, each roughly one US standard drink of 14 grams of ethanol.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d3b3e"/>
<stop offset="1" stop-color="#0a6467"/>
</linearGradient>
</defs>
<rect width="560" height="285" rx="14" fill="url(#bg)"/>

<text x="60" y="52" font-family="Inter,system-ui,sans-serif" font-size="15" font-weight="800" fill="#a8e6cf" letter-spacing="2">ONE STANDARD DRINK</text>
<text x="60" y="76" font-family="Inter,system-ui,sans-serif" font-size="13" fill="#d4e6e2">≈ 14 g ethanol in the US — whatever the glass.</text>
<!-- beer glass -->
<g>
<path d="M85 120 h70 v95 a10 10 0 0 1 -10 10 h-50 a10 10 0 0 1 -10 -10 z" fill="#f5f8f5" stroke="#a8e6cf" stroke-width="2.5"/>
<path d="M85 150 h70 v65 a10 10 0 0 1 -10 10 h-50 a10 10 0 0 1 -10 -10 z" fill="#ff8b61" opacity="0.9"/>
<rect x="97" y="112" width="46" height="12" fill="#a8e6cf" opacity="0.35"/>
</g>
<text x="120" y="255" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#b8d2cd" text-anchor="middle">US 12 oz · 5% ABV</text>
<!-- wine glass -->
<g>
<path d="M235 118 q0 42 22 50 v52 h-44 v-52 q22 -8 22 -50 z" fill="#f5f8f5" stroke="#a8e6cf" stroke-width="2.5"/>
<path d="M237 148 q0 28 20 35 v37 h-40 v-37 q18 -7 18 -35 z" fill="#ff8b61" opacity="0.9"/>
</g>
<text x="235" y="255" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#b8d2cd" text-anchor="middle">5 oz · 12% ABV</text>
<!-- shot -->
<g>
<path d="M365 158 h48 l-6 60 h-36 z" fill="#f5f8f5" stroke="#a8e6cf" stroke-width="2.5"/>
<path d="M367 178 h44 l-4 40 h-34 z" fill="#ff8b61" opacity="0.9"/>
</g>
<text x="389" y="255" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#b8d2cd" text-anchor="middle">1.5 oz · 40% ABV</text>
<!-- equal sign circle -->
<circle cx="470" cy="150" r="34" fill="none" stroke="#a8e6cf" stroke-width="2.5" stroke-dasharray="4 5"/>
<text x="470" y="146" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#a8e6cf" text-anchor="middle">≈</text>
<text x="470" y="172" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#b8d2cd" text-anchor="middle">same</text>
<text x="470" y="186" font-family="Inter,system-ui,sans-serif" font-size="11" fill="#b8d2cd" text-anchor="middle">dose</text>

</svg>