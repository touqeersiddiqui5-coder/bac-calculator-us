<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" width="560" height="285" role="img" aria-labelledby="t d">
<title id="t">Breath alcohol is exchanged from blood in the lungs</title>
<desc id="d">Simple diagram showing alcohol moving from blood in the lungs into exhaled breath and into a breath testing device reading 0.08 percent.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d3b3e"/>
<stop offset="1" stop-color="#0a6467"/>
</linearGradient>
</defs>
<rect width="560" height="285" rx="14" fill="url(#bg)"/>

<text x="40" y="42" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#a8e6cf" letter-spacing="1.5">BREATH ALCOHOL COMES FROM BLOOD</text>
<!-- simplified torso/lungs -->
<g>
<path d="M120 80 v95 a45 45 0 0 0 90 0 v-95" fill="none" stroke="#a8e6cf" stroke-width="2.5"/>
<!-- trachea -->
<path d="M158 70 h14 v40 h-14 z" fill="none" stroke="#a8e6cf" stroke-width="2.5"/>
<!-- left lung -->
<path d="M128 100 q-18 10 -16 55 q0 22 20 20 q10 -2 10 -30 v-40" fill="#0a6467" stroke="#a8e6cf" stroke-width="2.5"/>
<!-- right lung -->
<path d="M202 100 q18 10 16 55 q0 22 -20 20 q-10 -2 -10 -30 v-40" fill="#0a6467" stroke="#a8e6cf" stroke-width="2.5"/>
<!-- alveoli dots -->
<circle cx="132" cy="140" r="3.5" fill="#ff8b61"/><circle cx="146" cy="155" r="3.5" fill="#ff8b61"/><circle cx="136" cy="168" r="3.5" fill="#ff8b61"/>
<circle cx="198" cy="140" r="3.5" fill="#ff8b61"/><circle cx="184" cy="155" r="3.5" fill="#ff8b61"/><circle cx="194" cy="168" r="3.5" fill="#ff8b61"/>
<!-- exhaled breath path -->
<path d="M165 62 q40 -18 80 -2" stroke="#ff8b61" stroke-width="3" fill="none" stroke-dasharray="7 6" stroke-linecap="round"/>
<!-- breathalyzer device -->
<g>
<rect x="300" y="30" width="70" height="95" rx="10" fill="#f5f8f5" stroke="#a8e6cf" stroke-width="2.5"/>
<rect x="315" y="120" width="40" height="14" rx="4" fill="#0d3b3e"/>
<text x="335" y="65" font-family="monospace" font-size="17" font-weight="700" fill="#0d3b3e" text-anchor="middle">0.08</text>
<text x="335" y="85" font-family="Inter,system-ui,sans-serif" font-size="10" fill="#526467" text-anchor="middle">% BAC</text>
</g>
<!-- mouthpiece arrow -->
<path d="M292 108 l16 0" stroke="#ff8b61" stroke-width="4"/>
</g>
<text x="40" y="245" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#b8d2cd">Alcohol passes from blood into breath in the lungs —</text>
<text x="40" y="263" font-family="Inter,system-ui,sans-serif" font-size="12" fill="#b8d2cd">masking a smell does not change what a breath test measures.</text>

</svg>