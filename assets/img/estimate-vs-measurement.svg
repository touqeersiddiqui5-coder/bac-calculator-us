<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 285" width="560" height="285" role="img" aria-labelledby="t d">
<title id="t">BAC estimate compared with a laboratory measurement</title>
<desc id="d">Two panels: a browser calculator showing an approximate 0.06 percent estimate versus a laboratory result of 0.081 percent, illustrating that estimates and measurements can differ.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#0d3b3e"/>
<stop offset="1" stop-color="#0a6467"/>
</linearGradient>
</defs>
<rect width="560" height="285" rx="14" fill="url(#bg)"/>

<text x="40" y="42" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="800" fill="#a8e6cf" letter-spacing="1.5">ESTIMATE ≠ MEASUREMENT</text>
<!-- left: calculator estimate -->
<g>
<rect x="60" y="80" width="190" height="140" rx="14" fill="#f5f8f5" stroke="#a8e6cf" stroke-width="2.5"/>
<rect x="80" y="100" width="150" height="45" rx="8" fill="#0d3b3e"/>
<text x="155" y="130" font-family="monospace" font-size="16" fill="#a8e6cf" text-anchor="middle">~0.06%</text>
<rect x="80" y="158" width="34" height="24" rx="6" fill="#0a6467"/>
<rect x="126" y="158" width="34" height="24" rx="6" fill="#0a6467"/>
<rect x="172" y="158" width="34" height="24" rx="6" fill="#0a6467"/>
<rect x="80" y="192" width="34" height="24" rx="6" fill="#ff8b61"/>
<rect x="126" y="192" width="34" height="24" rx="6" fill="#0a6467"/>
<rect x="172" y="192" width="34" height="24" rx="6" fill="#0a6467"/>
</g>
<!-- vs circle -->
<circle cx="290" cy="150" r="26" fill="none" stroke="#ff8b61" stroke-width="2.5" stroke-dasharray="4 5"/>
<text x="290" y="156" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="800" fill="#ff8b61" text-anchor="middle">vs</text>
<!-- right: lab measurement -->
<g>
<rect x="330" y="80" width="190" height="140" rx="14" fill="#f5f8f5" stroke="#a8e6cf" stroke-width="2.5"/>
<!-- test tube with sample -->
<rect x="360" y="105" width="26" height="90" rx="6" fill="none" stroke="#0a6467" stroke-width="2"/>
<rect x="362" y="140" width="22" height="52" rx="4" fill="#ff8b61"/>
<!-- meter -->
<rect x="412" y="100" width="90" height="55" rx="8" fill="#0d3b3e"/>
<text x="457" y="122" font-family="monospace" font-size="14" fill="#a8e6cf" text-anchor="middle">0.081%</text>
<text x="457" y="140" font-family="Inter,system-ui,sans-serif" font-size="9" fill="#b8d2cd" text-anchor="middle">LAB CERTIFIED</text>
<!-- tick rows -->
<line x1="412" y1="170" x2="500" y2="170" stroke="#a8e6cf" stroke-width="1" opacity="0.5"/>
<line x1="412" y1="182" x2="475" y2="182" stroke="#a8e6cf" stroke-width="1" opacity="0.5"/>
<line x1="412" y1="194" x2="490" y2="194" stroke="#a8e6cf" stroke-width="1" opacity="0.5"/>
</g>
<text x="40" y="245" font-family="Inter,system-ui,sans-serif" font-size="11.5" fill="#b8d2cd">An estimate models a number; a breath or blood test measures one. They can disagree.</text>

</svg>